<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guía de Comandos Git</title>
    <!-- AÑADIDO: Fuentes de Google con estética espacial / futurista -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- MANTENIDO: Estructura original del header -->
    <header>
        <h1>Diccionario Git Interactiva</h1>
        <p>Aprendiendo a trabajar con ramas</p>
    </header>

    <!-- AÑADIDO: Contenedor para simular el campo estelar de fondo -->
    <div class="space-bg"></div>

    <!-- MANTENIDO: Contenedor y secciones originales -->
    <main id="contenedor">
        <section class="comando">
            <h2>git init</h2>
            <p>Inicializa un nuevo repositorio local en la carpeta actual.</p>
        </section>
        <section class="comando">
            <h2>git clone</h2>
            <p>Descarga una copia exacta de un repositorio remoto.</p>
        </section>
        <section class="comando">
            <h2>git add</h2>
            <p>Prepara los cambios (staging) para ser incluidos en el próximo commit.</p>
        </section>
        <!-- MANTENIDO: Comentario original del curso -->
        <!-- Aquí los estudiantes agregarán más comandos luego -->
    </main>
</body>
</html>
